<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>이동 중…</title>
<!-- 생성물 — 손으로 고치지 말 것. 재생성: python scripts/build_go_page.py
     카카오톡은 등록된 사이트 도메인으로만 링크할 수 있어, 카톡 알림의 링크가 이 페이지를
     거쳐 네이버로 간다(디스코드는 직접 링크). 상세 경위는 scripts/build_go_page.py. -->
<style>
  body { margin: 0; display: flex; min-height: 100vh; align-items: center;
         justify-content: center; font-family: system-ui, -apple-system, sans-serif;
         background: #fff; color: #1a1c20; }
  main { text-align: center; padding: 24px; }
  a { color: #135fcd; }
  @media (prefers-color-scheme: dark) { body { background: #14161a; color: #e8eaed; }
                                        a { color: #41a2f9; } }
</style>
</head>
<body>
<main>
  <p id="msg">네이버 증권으로 이동 중…</p>
  <p><a id="fallback" href="https://0101-commits.github.io/economic-site/">바로 열리지 않으면 여기를 누르세요</a></p>
</main>
<script>
// 화이트리스트만 — 임의 URL 은 받지 않는다(열린 리다이렉트 방지).
var LINKS = {
  "KOSPI": "https://finance.naver.com/sise/sise_index.naver?code=KOSPI",
  "KOSDAQ": "https://finance.naver.com/sise/sise_index.naver?code=KOSDAQ",
  "SP500": "https://finance.naver.com/world/sise.naver?symbol=SPI@SPX",
  "NASDAQ": "https://finance.naver.com/world/sise.naver?symbol=NAS@IXIC",
  "Nikkei": "https://finance.naver.com/world/sise.naver?symbol=NII@NI225",
  "SOX": "https://finance.naver.com/world/sise.naver?symbol=NAS@SOX",
  "Shanghai": "https://finance.naver.com/world/sise.naver?symbol=SHS@000001",
  "USDKRW": "https://finance.naver.com/marketindex/exchangeDetail.naver?marketindexCd=FX_USDKRW",
  "USDJPY": "https://finance.naver.com/marketindex/worldExchangeDetail.naver?marketindexCd=FX_USDJPY",
  "EURUSD": "https://finance.naver.com/marketindex/worldExchangeDetail.naver?marketindexCd=FX_EURUSD",
  "Gold": "https://finance.naver.com/marketindex/worldGoldDetail.naver?marketindexCd=CMDT_GC",
  "Silver": "https://finance.naver.com/marketindex/worldGoldDetail.naver?marketindexCd=CMDT_SI",
  "Copper": "https://stock.naver.com/marketindex/metals/HGcv1/price",
  "WTI": "https://finance.naver.com/marketindex/worldOilDetail.naver?marketindexCd=OIL_CL",
  "Brent": "https://finance.naver.com/marketindex/worldOilDetail.naver?marketindexCd=OIL_BRT",
  "NatGas": "https://finance.naver.com/marketindex/worldOilDetail.naver?marketindexCd=CMDT_NG"
};
var DASH = "https://0101-commits.github.io/economic-site/";
(function () {
  var q = new URLSearchParams(location.search);
  var k = q.get('k') || '';
  var s = q.get('s') || '';
  var to = null;
  if (k && Object.prototype.hasOwnProperty.call(LINKS, k)) to = LINKS[k];
  else if (/^[0-9]{6}$/.test(s)) to = "https://finance.naver.com/item/main.naver?code=" + s;   // 국내 종목 6자리만
  if (!to) {
    to = DASH;
    document.getElementById('msg').textContent = '대시보드로 이동 중…';
  }
  document.getElementById('fallback').href = to;
  location.replace(to);
})();
</script>
</body>
</html>
