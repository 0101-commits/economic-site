  params: {step: {kospi: 1000, usdkrw: 50, gold: 250, btc: 10000, wti: 10, sp500: 250}}
  run: light
  cooldown: {per: [target], days: 1}
  title: "{name} {value} · {level_value} 선 {dir_ko}"
  why: ["52주 고점 대비 {from_high}"]
  next: ["다음 마디 {next_level}"]
