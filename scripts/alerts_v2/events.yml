# 사건 사전 — 알림 v2 의 단일 원천(기획서 3장). 최소 YAML 부분집합(schema.py 머리말)으로만 적는다.
# level: alarm(경보) alert(알림) notice(안내) record(기록) · run: light full settle daily eve
# targets 는 bundles/registry.json 의 id(없으면 context.ALIASES). default_on 이 비면 별표(관심)만.
# 템플릿 변수: {name} 대상 이름 · {value} 표시 값 · {chg} 등락% · {dir_ko} 방향 말 · 그 밖은 Hit.fields.

# ---- A 급변 ----
- id: A1
  name: 지수 급변
  family: A
  level: alert
  escalate: {cond: "abs_z>=3.0", to: alarm}
  targets: [kospi, kosdaq, sp500, nasdaq, nikkei, sox, hsi, shanghai]
  default_on: [kospi, sp500]
  judge: swing_sigma
  params: {sigma: 2.5, clamp_pct: [0.5, 5.0], fallback_pct: {kospi: 2.0, kosdaq: 2.0, sp500: 2.0, nasdaq: 2.0}}
  run: light
  cooldown: {per: [target, dir], days: 1}
  title: "{name} {chg:+.1f}% · {value}"
  why: ["{peer} 동반", "{news}"]
  next: ["{next_event}", "{next_round}"]
  url: "#/i/{target}"
- id: A2
  name: 환율 급변
  family: A
  level: alert
  escalate: {cond: "abs_z>=3.0", to: alarm}
  targets: [usdkrw, jpykrw, usdjpy, eurkrw]
  default_on: [usdkrw]
  judge: swing_sigma
  params: {sigma: 2.5, clamp_pct: [0.5, 5.0], fallback_pct: {usdkrw: 1.0}}
  run: light
  cooldown: {per: [target, dir], days: 1}
  title: "{name} {chg:+.1f}% · {value}"
  why: ["{peer} 동반", "{news}"]
  next: ["{lens_line}", "{next_event}"]
  url: "#/i/{target}"
- id: A3
  name: 원자재 급변
  family: A
  level: alert
  escalate: {cond: "abs_z>=3.0", to: alarm}
  targets: [gold, silver, copper, wti, brent, natgas]
  default_on: []
  judge: swing_sigma
  params: {sigma: 2.5, clamp_pct: [0.5, 5.0]}
  run: light
  cooldown: {per: [target, dir], days: 1}
  title: "{name} {chg:+.1f}% · {value}"
  why: ["{peer} 동반", "{news}"]
  next: ["{next_round}"]
  url: "#/i/{target}"
- id: A4
  name: 비트코인 급변
  family: A
  level: alert
  targets: [btc]
  default_on: []
  judge: swing_sigma
  params: {sigma: 2.5, clamp_pct: [0.5, 8.0], daily: true}
  run: full
  cooldown: {per: [target], days: 1}
  title: "비트코인 {chg:+.1f}% · {value}"
  why: ["{news}"]
  next: ["{next_round}"]
  url: "#/i/btc"
- id: A5
  name: 서킷브레이커
  family: A
  level: alarm
  targets: [kospi, kosdaq]
  default_on: [kospi, kosdaq]
  judge: market_halt
  params: {stages_pct: [-8, -15, -20], sidecar_pct: 2.5}
  run: light
  cooldown: {per: [target, stage], days: 1}
  title: "{name} {chg:+.1f}% · {halt_kind} {stage}단계{approx}"
  why: ["{peer} 동시 · {source}"]
  next: ["해제되면 알림 · 다음 단계 {next_stage}%"]
  url: "#/market?a=kr"
# ---- B 기록 · 마디 ----
- id: B1
  name: 52주 신고저
  family: B
  level: alert
