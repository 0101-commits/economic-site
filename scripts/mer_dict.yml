# 메르 리스크 렌즈 — 정규화 사전
# 자유 서술 from/to/indicator/asset 문자열을 정식 ID 하나로 접는다.
# 근거: 기획안 §3.7 ① — 810개 엣지에서 문자열이 같은 쌍은 최대 n=2. 사전 없이는 히트맵이 통째로 빈다.
# aliases 는 정규식(대소문자 무시, 부분 일치). entities 순서대로 첫 일치가 이긴다(specific → generic).
# layer: cause(원인) → market(시장 변수) → channel(창구) → asset(자산)
# dataKind: close(history.*[{date,close}]) | map({date:val}) | curve(yieldCurve) | sentiment
#           | jgb(mer_series.jgb:<tenor>) | meritems(mer_series.<name>:<item>) | none
# transform: yoy — 지수(index) 시계열을 전년동월 대비 %로 바꾼다. 임계가 %로 적힌 지표 전용.
version: v0.4
updated: 2026-09-16
layers: [cause, market, channel, asset]

