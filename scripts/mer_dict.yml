# ───────────────────────── 전이 경로 프리셋 (기획안 §3.3, 5구간 교차 병합본)
# 통계로 재발견하지 않는다 — 자유 서술 사슬은 문자열이 일치하지 않아 병합이 0으로 떨어진다.
# 여기 적힌 순서가 블록 ②의 「경로 하이라이트」이고, n·logNos 는 집계기가
# 추출 chain 문자열에 이 ID가 2개 이상 등장하는 글을 세어 붙인다.
chains:
- id: C1
  label: 재정 눈덩이
  steps: [us10y, fiscal, ust, us10y]
  note: 금리↑ → 이자비용↑ → 적자↑ → 국채 발행↑ → 국채가 흔해짐 → 금리↑
- id: C2
  label: 바이백 되돌이표
  steps: [us10y, buyback, fiscal, us10y]
  note: 금리 급등 → 바이백 확대 → 단기채 조달 → 만기 단축·텀프리미엄↑ → 금리 재상승
- id: C3
  label: 유동성 3형제
  steps: [rrp, tga, reserves, liquidity, fed_policy]
  note: RRP 소진 → TGA 재건 → 지급준비금 하회 → 레포 급증 → QT 중단 → QE 탐색
- id: C4
  label: 변동성 → 기계적 매도
  steps: [vkospi, foreign_flow, kospi, volatility]
  note: VKOSPI↑ → VaR 부풀음 → 위험예산 초과 → 외국인 축소 → 지수↓ → 변동성↑
- id: C5
  label: 봉쇄 파편
  steps: [hormuz, oil, lng, agri, rare_earth, semis]
  note: 봉쇄 → 원유·LNG / 나프타→플라스틱 / 황·요소→비료 / 헬륨→반도체 / 중질유→경유
- id: C6
  label: 엔 스퀴즈
  steps: [usdjpy, japan_policy, carry_trade, jgb30y, us_equity]
  note: 엔 약세 → 개입 → 숏 손절 도미노 → 엔 급등 → 캐리 청산 → 위험자산 디레버리징
- id: C7
  label: 레버리지 증폭
  steps: [etf_2x, semis, volatility, regulation]
  note: 2배 ETF 허용 → 유입 → 종가 변동성↑ → 서킷 빈발 → 규제 → 청산은 2배로
- id: C8
  label: 규제 풍선(부동산)
  steps: [regulation, realestate, banks]
  note: 규제지역 지정 → 인근 급등 → 확대 → 대출 한도 축소 → 보유세 인상
- id: C9
  label: 사모대출 이연
  steps: [private_credit, hy_spread, banks]
  note: PIK 이연 → 만기도래 급증 → 연장 거절 → 환매 한도 초과 → 게이트
- id: C10
  label: 톤마일 수혜
  steps: [hormuz, freight_rate, ships]
  note: 우회 항로 → 톤마일↑ → 중고선가가 신조선가 역전 → 한국 조선
