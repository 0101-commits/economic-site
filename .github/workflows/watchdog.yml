name: Watchdog (알림 파이프라인 상시 감시)

# 이 저장소에서 가장 위험한 실패는 시끄러운 실패가 아니라 침묵이다.
# 2026-08-19 에 생긴 좀비 queued 런 하나가 Cloudflare Worker 의 dispatch 게이트를
# 34일간 막았고, 그동안 장중 매분 평가가 통째로 멈춰 있었다 — 워크플로는 전부 초록이었고
# 아무 알림도 오지 않았다. 실패 런이 아예 안 생겼으므로 실패 알림으로는 잡을 수 없었다.
#
# 그래서 감시가 두 갈래다:
#   failure  런이 실패하면 즉시(workflow_run) — 어느 스텝이 죽었는지까지 적어 보낸다.
#   silence  30분마다 '최근 런이 있는가'를 본다 — 트리거 자체가 끊긴 경우를 잡는다.
#
# ⚠ 이 워크플로는 감시 대상에 자기 자신을 넣지 않는다(실패 통지가 실패를 낳는 고리 방지).
on:
  workflow_run:
    workflows:
      - "Market Data Fetch"
      - "Stock Alerts (KakaoTalk, 장중 5분)"
      - "KakaoTalk Digest (평일 07-22 매시간 · 주말 11·17 KST)"
    types: [completed]
  # 주 경로 = Worker 매분 cron 이 30분마다(:03·:33) 깨운다(cloudflare-worker/worker.js 'watchdog').
  # GHA schedule 은 실측 3~5시간에 한 번만 발화해(2026-09-28) 주 경로가 될 수 없다 — Worker 가
  # 통째로 죽었을 때를 위한 백업으로만 남긴다(Worker 가 죽으면 Worker 발 감시도 같이 죽는다).
  repository_dispatch:
    types: [watchdog]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write         # 런·잡 조회 + 사이트 배포 대기 런 취소(watchdog.check_pages_stuck — 자가 치유)

# 그룹을 모드별로 나눈다. 한 그룹이면 1분마다 오는 workflow_run 런(대부분 job 에서 skipped)이
# 대기 중인 런을 밀어낸다 — GitHub 은 그룹의 대기 런을 새 대기 런이 오면 취소한다. 그러면
# silence 감시 한 회차, 또는 fetch-data 실패 통지 한 건이 조용히 사라진다.
#   failure  런마다 고유 그룹 — 서로 막지도 밀어내지도 않는다.
#   silence  한 그룹 직렬 — Worker :03·:04 이중 발화나 GHA 백업이 겹쳐도 뒤 런은 앞 런을
#            '직전 감시'로 보고 같은 조건을 다시 알리지 않는다(watchdog.py _prev_check).
concurrency:
  group: ${{ github.event_name == 'workflow_run' && format('watchdog-run-{0}', github.run_id) || 'watchdog-silence' }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # 실패 통지는 실제로 실패한 런에 대해서만. 성공·취소·건너뜀은 조용히 끝낸다.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'failure'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      # 의존성 설치 없음 — watchdog 의 임포트 사슬(check_alerts → send_kakao_digest →
      # kwmatch, toss_api, notify_discord)은 표준 라이브러리만 쓴다. 설치 단계를 넣으면
      # 그 단계가 감시자를 멈추는 새 실패 지점이 된다.
      - name: 감시
        env:
          WATCHDOG_MODE: ${{ github.event_name == 'workflow_run' && 'failure' || 'silence' }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_URL: ${{ github.event.workflow_run.html_url }}
          WF_RUN_ID: ${{ github.event.workflow_run.id }}
          WF_ID: ${{ github.event.workflow_run.workflow_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_SYSTEM: ${{ secrets.DISCORD_WEBHOOK_SYSTEM }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python scripts/watchdog.py
