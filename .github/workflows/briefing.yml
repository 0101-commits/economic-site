name: Briefing v2 (아침 · 마감 · 주간 + 선택 3)

# 알림 v2 브리핑 — 시각이 정해진 통(기획서 4장 「브리핑 틀」 · 6장 편성표 · 계약서 docs/superpowers/plans/2026-10-05-alerts-v2.md B5).
#   기본 켜짐: morning 평일 07:30 · close 평일 16:30 · weekly 토 09:00 (KST)
#   선택(기본 꺼짐): noon 평일 12:00 · evening 평일 18:30 · us 평일 22:40 — cron 은 늘 돌고, 설정(/prefs briefings)이
#   꺼져 있으면 run.py 가 보내지 않고 끝난다. 한국 휴장일엔 noon · close · evening 을 건너뛴다(아침은 「휴장일 아침」).
#   작성 · 발송 = scripts/alerts_v2/briefing.py, 시각 단일 원천 = briefing.SLOT_AT(아래 cron 과 test_slot_schedule 이 대조).
#   저장소 변수 ALERTS_V2 가 '1' 이 아니면 잡 전체를 건너뛴다(현행 kakao-daily 가 다이제스트를 계속 맡는다).
on:
  schedule:
    # 줄 끝 주석의 슬롯 이름을 test_slot_schedule 이 읽는다 — 줄을 바꾸면 아래 「슬롯 판정」 case 도 같이 바꿀 것.
    - cron: '30 22 * * 0-4'   # morning — KST 평일 07:30
    - cron: '0 3 * * 1-5'     # noon — KST 평일 12:00
    - cron: '30 7 * * 1-5'    # close — KST 평일 16:30
    - cron: '30 9 * * 1-5'    # evening — KST 평일 18:30
    - cron: '40 13 * * 1-5'   # us — KST 평일 22:40
    - cron: '0 0 * * 6'       # weekly — KST 토 09:00
  workflow_dispatch:
    inputs:
      slot:
        description: '브리핑 슬롯'
        required: true
        default: 'morning'
        type: choice
        options: [morning, close, noon, evening, us, weekly]
  repository_dispatch:
    types: [brief]              # client_payload.slot

permissions:
  contents: write               # 원장(events/) 커밋 — 아침 카드에 합류한 보류 행 표시
  issues: write                 # 카톡 토큰 만료 통지(send_kakao_digest._gh_issue_notify)

concurrency:
  group: briefing
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  brief:
    if: vars.ALERTS_V2 == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 슬롯 판정
        id: gate
        env:
          SCHED: ${{ github.event.schedule }}
          IN_SLOT: ${{ inputs.slot || github.event.client_payload.slot }}
        run: |
          case "$SCHED" in
            '30 22 * * 0-4') slot=morning ;;
            '0 3 * * 1-5') slot=noon ;;
            '30 7 * * 1-5') slot=close ;;
            '30 9 * * 1-5') slot=evening ;;
            '40 13 * * 1-5') slot=us ;;
            '0 0 * * 6') slot=weekly ;;
            *) slot="$IN_SLOT" ;;
          esac
          case "$slot" in morning|close|noon|evening|us|weekly) proceed=true ;; *) proceed=false ;; esac
          echo "slot=$slot"                          >> "$GITHUB_OUTPUT"
          echo "proceed=$proceed"                    >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=Asia/Seoul date +%Y%m%d)"  >> "$GITHUB_OUTPUT"
          echo "[gate] event=${{ github.event_name }} slot=$slot proceed=$proceed"

      # 중복 발송 방지 — 같은 날 같은 슬롯은 한 번(cron 과 repository_dispatch 가 겹쳐도). run.py 가 실제로 한 채널이라도
      # 보냈을 때만 .brief_sent_marker 를 만들고, 이 캐시가 잡 끝에 그것을 저장한다. 수동 실행은 마커를 보지 않는다.
      - name: 중복 발송 방지 마커 복원
        if: steps.gate.outputs.proceed == 'true' && github.event_name != 'workflow_dispatch'
        id: marker
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .brief_sent_marker
          key: brief-sent-${{ steps.gate.outputs.date }}-${{ steps.gate.outputs.slot }}

      - name: Checkout
        if: steps.gate.outputs.proceed == 'true' && steps.marker.outputs.cache-hit != 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.ref_name || 'main' }}
          fetch-depth: 1

      - name: Set up Python
        if: steps.gate.outputs.proceed == 'true' && steps.marker.outputs.cache-hit != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install deps
        if: steps.gate.outputs.proceed == 'true' && steps.marker.outputs.cache-hit != 'true'
        run: pip install matplotlib requests pynacl

      # 한글 폰트 — 정적 OTF 2종을 actions/cache 로 재사용(stock-alerts · alerts-v2 와 같은 키). 실패해도 카드는 영문 라벨.
      - name: Korean fonts (cache)
        if: steps.gate.outputs.proceed == 'true' && steps.marker.outputs.cache-hit != 'true'
        id: kofonts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/kofonts
          key: noto-sans-kr-static-v1
      - name: Korean fonts (download on cache miss)
        if: steps.gate.outputs.proceed == 'true' && steps.marker.outputs.cache-hit != 'true' && steps.kofonts.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          mkdir -p ~/kofonts
          for w in Regular Bold; do
            curl -fsSL --max-time 30 -o ~/kofonts/NotoSansKR-$w.otf \
              "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/SubsetOTF/KR/NotoSansKR-$w.otf"
          done

      # 🧪 테스트 관문(A1) — kakao-daily · alerts-v2 와 같은 모양 · 같은 통과 마커 캐시.
      - name: Restore test pass marker
        if: steps.gate.outputs.proceed == 'true' && steps.marker.outputs.cache-hit != 'true'
        id: tests-ok
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pytest_ok
          key: pytest-ok-${{ hashFiles('scripts/**/*.py', 'scripts/alerts_v2/events.yml', 'app/src/App.tsx', 'app/src/screens/**', 'app/src/components/**') }}

      - name: Run tests
        if: steps.gate.outputs.proceed == 'true' && steps.marker.outputs.cache-hit != 'true' && steps.tests-ok.outputs.cache-hit != 'true'
        env:
          KO_FONT_PATH: ~/kofonts
        run: |
          pip install pytest PyYAML yfinance
          python -m pytest scripts/tests -q -x
          git status --short
          git checkout -- .
          touch .pytest_ok

      - name: Save test pass marker
        if: steps.gate.outputs.proceed == 'true' && steps.marker.outputs.cache-hit != 'true' && steps.tests-ok.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pytest_ok
          key: pytest-ok-${{ hashFiles('scripts/**/*.py', 'scripts/alerts_v2/events.yml', 'app/src/App.tsx', 'app/src/screens/**', 'app/src/components/**') }}

      - name: Briefing — 작성 · 발송
        if: steps.gate.outputs.proceed == 'true' && steps.marker.outputs.cache-hit != 'true'
        env:
          SLOT: ${{ steps.gate.outputs.slot }}
          KO_FONT_PATH: ~/kofonts
          ALERTS_V2: ${{ vars.ALERTS_V2 || '0' }}
          ALERTS_SYNC_KEY: ${{ secrets.ALERTS_SYNC_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_FRIENDS: ${{ vars.KAKAO_FRIENDS || '0' }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_SYSTEM: ${{ secrets.DISCORD_WEBHOOK_SYSTEM }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python scripts/alerts_v2/run.py --mode brief --slot "$SLOT"

      # 웹 푸시 — run.py 가 쌓은 scripts/push_queue.json 을 보낸다(아침 · 마감만 쌓는다).
      - name: Send web push
        if: always() && steps.gate.outputs.proceed == 'true' && steps.marker.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          PUSH_READ_KEY: ${{ secrets.PUSH_READ_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          pip install pywebpush==2.5.0
          python scripts/send_push.py

      - name: Commit events/ (사건 원장)
        if: always() && steps.gate.outputs.proceed == 'true' && steps.marker.outputs.cache-hit != 'true'
        env:
          SLOT: ${{ steps.gate.outputs.slot }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          branch="${GITHUB_REF_NAME:-main}"
          [ -d events ] || { echo "원장 없음 — 커밋 건너뜀"; exit 0; }
          git add events
          if git diff --staged --quiet -- events; then echo "변경 사항 없음 — 커밋 건너뜀"; exit 0; fi
          msg="alerts: 브리핑 ${SLOT} 원장 $(date -u +'%Y-%m-%d %H:%M UTC')"
          rm -rf /tmp/events.run && cp -r events /tmp/events.run
          git commit -m "$msg" -q || true
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then echo "push 성공 (시도 ${attempt})"; exit 0; fi
            echo "push 실패 (시도 ${attempt}) — 원격 최신 위에 원장만 재적용"
            git fetch origin "${branch}" || true
            git reset --hard "origin/${branch}" 2>/dev/null || git reset --hard FETCH_HEAD || true
            mkdir -p events && cp -r /tmp/events.run/. events/
            git add events
            if git diff --staged --quiet -- events; then echo "원격이 이미 최신 — 종료"; exit 0; fi
            git commit -m "$msg" -q || true
            sleep $((attempt * 3))
          done
          echo "::error::events 원장 push 실패 (재시도 소진)"; exit 1
