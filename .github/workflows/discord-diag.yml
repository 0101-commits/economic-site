name: Discord Interactions 진단 (manual)

# 버튼이 "애플리케이션이 적시에 응답하지 않았어요" 로 죽을 때 원인을 가른다.
# 봇 토큰은 이 저장소 시크릿에만 있어 로컬에서 앱 설정을 읽을 수 없다 — 그래서 여기서 돈다.
# 읽기 전용이고 토큰·공개키 전문은 출력하지 않는다(공개키는 앞 12자만 대조용).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: 앱 설정 대조
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python scripts/discord_diag.py
