name: Master Daily Snapshot

# 마스터 보유 암호 덩어리를 풀어 전날 종가로 평가액을 계산해 서버 스냅샷(암호 덩어리)에 합쳐 올린다 — scripts/master_snapshot.py.
# 화~토 07:10 KST(= 월~금 22:10 UTC, 전날 한국 · 미국 장 마감 뒤) + 수동 실행. 저장소에 커밋하지 않는다.
# 비밀값이 빠지면 한 줄 이유를 남기고 성공으로 끝난다. 덩어리가 안 풀리면(열쇠 틀림) 실패해 눈에 띈다.
# 이름은 test_watchdog 감시 목록 · pages.yml 트리거와 겹치지 않는다(실패해도 다른 워크플로와 무관).
on:
  schedule:
    - cron: '10 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: pip install cryptography requests
      - name: Build master snapshot
        env:
          MASTER_HOLD_KEY: ${{ secrets.MASTER_HOLD_KEY }}
          PUSH_READ_KEY: ${{ secrets.PUSH_READ_KEY }}
          PUSH_WRITE_KEY: ${{ secrets.PUSH_WRITE_KEY }}
        run: python scripts/master_snapshot.py
